apiVersion: apps/v1
kind: Deployment
metadata:
  name: narwhal
  labels:
    app.kubernetes.io/name: narwhal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: narwhal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: narwhal
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: narwhal
          image: narwhal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NARWHAL_ROOT
              value: /data
            - name: NARWHAL_ROOT_NAME
              value: Storage
            - name: NARWHAL_READ_ONLY
              value: "false"
            - name: NARWHAL_MAX_UPLOAD_MB
              value: "0"
            - name: NARWHAL_PLACES
              value: ""
            - name: NARWHAL_ALLOWED_HOSTS
              value: ""
            - name: RUST_LOG
              value: info,tower_http=info
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: narwhal-data
