apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/narwhal

images:
  - name: narwhal
    newName: ghcr.io/amreshh/narwhal
    newTag: 0.1.5

patches:
  - target:
      kind: HTTPRoute
      name: narwhal
    patch: |-
      - op: add
        path: "/spec/hostnames"
        value:
          - narwhal.kubernetes.home
