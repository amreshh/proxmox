apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-source-controller-to-repos
spec:
  description: allow source controller to access repos
  endpointSelector:
    matchLabels:
      app: source-controller
  egress:
    - toFQDNs:
        - matchName: democratic-csi.github.io
        - matchName: kubernetes-sigs.github.io
        - matchName: release-assets.githubusercontent.com
        - matchName: ghcr.io
        - matchName: pkg-containers.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-helm-controller-to-raw-githubusercontent
spec:
  description: allow helm controller to access raw.githubusercontent.com
  endpointSelector:
    matchLabels:
      app: helm-controller
    egress:
      - toFQDNs:
          - matchName: raw.githubusercontent.com
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
