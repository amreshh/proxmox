apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-kube-dns-scrape
spec:
  description: allow kube-dns scraping
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmagent
            io.kubernetes.pod.namespace: victoria-metrics
      toPorts:
        - ports:
            - port: "9153"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-vm-stack-sync-job
spec:
  description: allow the chart's post-install sync job to fetch dashboards/rules and manage resources
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics-k8s-stack
      app.kubernetes.io/component: syncJob
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toFQDNs:
        - matchName: raw.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
