apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: hubble
spec:
  selector:
    matchLabels:
      k8s-app: hubble
  namespaceSelector:
    matchNames:
      - kube-system
  endpoints:
    - port: hubble-metrics
      path: /metrics
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: immich-db
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: immich-db
  namespaceSelector:
    matchNames:
      - immich
  podMetricsEndpoints:
    - port: metrics
      path: /metrics

---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: cilium-agent
spec:
  selector:
    matchLabels:
      k8s-app: cilium
  namespaceSelector:
    matchNames:
      - kube-system
  podMetricsEndpoints:
    - port: prometheus
      path: /metrics
      relabelConfigs:
        - sourceLabels: [__meta_kubernetes_pod_label_k8s_app]
          targetLabel: k8s_app
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: cilium-operator
spec:
  selector:
    matchLabels:
      io.cilium/app: operator
  namespaceSelector:
    matchNames:
      - kube-system
  podMetricsEndpoints:
    - port: prometheus
      path: /metrics
      relabelConfigs:
        - sourceLabels: [__meta_kubernetes_pod_label_io_cilium_app]
          targetLabel: io_cilium_app
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: cilium-envoy
spec:
  selector:
    matchLabels:
      k8s-app: cilium-envoy
  namespaceSelector:
    matchNames:
      - kube-system
  podMetricsEndpoints:
    - port: envoy-metrics
      path: /metrics
