apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-wirepulse
  namespace: wirepulse
spec:
  description: allow wirepulse ingress from gateway and kubelet, egress to kube-apiserver and hubble-relay
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: wirepulse
  ingress:
    - fromEntities:
        - ingress
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: hubble-relay
      toPorts:
        - ports:
            - port: "4245"
              protocol: TCP
