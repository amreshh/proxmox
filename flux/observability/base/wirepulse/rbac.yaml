apiVersion: v1
kind: ServiceAccount
metadata:
  name: wirepulse
  namespace: wirepulse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wirepulse
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["cilium.io"]
    resources:
      - ciliumnetworkpolicies
      - ciliumclusterwidenetworkpolicies
      - ciliumnodeconfigs
      - ciliumendpoints
      - ciliumendpointslices
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wirepulse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wirepulse
subjects:
  - kind: ServiceAccount
    name: wirepulse
    namespace: wirepulse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wirepulse-cilium-config
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cilium-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wirepulse-cilium-config
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wirepulse-cilium-config
subjects:
  - kind: ServiceAccount
    name: wirepulse
    namespace: wirepulse
