apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wirepulse
  namespace: wirepulse
spec:
  parentRefs:
    - name: default-gateway
      namespace: gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: wirepulse
          port: 80
