apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/victoria-metrics
  - secrets.yaml

patches:
  - target:
      kind: HTTPRoute
      name: grafana
    patch: |-
      - op: add
        path: "/spec/hostnames"
        value:
          - grafana.dev.kubernetes.home
  - target:
      kind: HelmRelease
      name: victoria-metrics-k8s-stack
    patch: |-
      - op: add
        path: "/spec/values/kubeEtcd/endpoints"
        value:
          - 10.10.10.20
