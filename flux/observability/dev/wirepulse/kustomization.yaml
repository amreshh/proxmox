apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/wirepulse

images:
  - name: wirepulse
    newName: ghcr.io/amreshh/wirepulse
    newTag: latest

patches:
  - target:
      kind: HTTPRoute
      name: wirepulse
    patch: |-
      - op: add
        path: "/spec/hostnames"
        value:
          - wirepulse.dev.kubernetes.home
  - target:
      kind: Deployment
      name: wirepulse
    patch: |-
      - op: replace
        path: "/spec/template/spec/containers/0/imagePullPolicy"
        value: Always
      - op: add
        path: "/spec/template/spec/containers/0/env/-"
        value:
          name: WIREPULSE_ALLOWED_HOSTS
          value: wirepulse.dev.kubernetes.home
