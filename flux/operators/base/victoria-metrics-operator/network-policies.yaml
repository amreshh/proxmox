apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-victoria-metrics-operator
spec:
  description: allow ingress from remote-node and egress to kube-apiserver
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: victoria-metrics-operator
  ingress:
    - fromEntities:
        - remote-node
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
